<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#1b263b" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#9b51e0" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0.1"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .neural-grid { stroke: #1e3a5f; stroke-width: 1; stroke-opacity: 0.35; }
    .pulse-node {
      animation: pulse 3s ease-in-out infinite alternate;
    }
    .flow-line {
      stroke-dasharray: 8, 12;
      animation: dash 15s linear infinite;
    }
    .floating-pill {
      animation: float 6s ease-in-out infinite alternate;
    }
    @keyframes dash {
      to {
        stroke-dashoffset: -200;
      }
    }
    @keyframes pulse {
      0% { r: 4px; opacity: 0.4; }
      100% { r: 9px; opacity: 0.9; }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-10px); }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Background Network / Flow lines -->
  <g opacity="0.45">
    <line x1="50" y1="60" x2="1150" y2="60" class="neural-grid" />
    <line x1="50" y1="180" x2="1150" y2="180" class="neural-grid" />
    <line x1="50" y1="300" x2="1150" y2="300" class="neural-grid" />
    <line x1="200" y1="20" x2="200" y2="340" class="neural-grid" />
    <line x1="600" y1="20" x2="600" y2="340" class="neural-grid" />
    <line x1="1000" y1="20" x2="1000" y2="340" class="neural-grid" />

    <!-- Animated Data Flow Curves -->
    <path d="M 100,320 Q 350,60 650,220 T 1100,80" fill="none" stroke="#00f2fe" stroke-width="2" class="flow-line" opacity="0.6" />
    <path d="M 80,100 Q 400,340 750,140 T 1120,280" fill="none" stroke="#9b51e0" stroke-width="2" class="flow-line" opacity="0.5" />
    
    <!-- Pulsing Nodes -->
    <circle cx="100" cy="320" r="6" fill="#00f2fe" class="pulse-node" />
    <circle cx="350" cy="115" r="7" fill="#4facfe" class="pulse-node" style="animation-delay: 1s;" />
    <circle cx="650" cy="220" r="8" fill="#9b51e0" class="pulse-node" style="animation-delay: 2s;" />
    <circle cx="950" cy="110" r="6" fill="#00f2fe" class="pulse-node" style="animation-delay: 0.5s;" />
    <circle cx="1100" cy="80" r="7" fill="#9b51e0" class="pulse-node" style="animation-delay: 1.5s;" />
  </g>

  <!-- Interactive/Floating Pills in Background (Lower Opacity, Non-blocking) -->
  <g class="floating-pill" opacity="0.65">
    <!-- Pill 1 -->
    <rect x="80" y="35" width="130" height="32" rx="16" fill="#1b2a4a" stroke="#00f2fe" stroke-width="1.5" />
    <text x="145" y="56" fill="#00f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ GPU Clusters</text>

    <!-- Pill 2 -->
    <rect x="990" y="40" width="140" height="32" rx="16" fill="#241940" stroke="#9b51e0" stroke-width="1.5" />
    <text x="1060" y="61" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🚀 Distributed ML</text>

    <!-- Pill 3 -->
    <rect x="130" y="290" width="150" height="32" rx="16" fill="#1e2238" stroke="#4facfe" stroke-width="1.5" />
    <text x="205" y="311" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🧠 PyTorch &amp; JAX</text>

    <!-- Pill 4 -->
    <rect x="960" y="290" width="160" height="32" rx="16" fill="#1e2238" stroke="#00f2fe" stroke-width="1.5" />
    <text x="1040" y="311" fill="#67e8f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🔥 High-Perf Inference</text>
  </g>

  <!-- Foreground Title and Content (Clear, bold, high contrast, guaranteed readable) -->
  <g id="foreground-content">
    <!-- Glowing Badge -->
    <rect x="440" y="50" width="320" height="32" rx="16" fill="#101c36" stroke="url(#primaryGrad)" stroke-width="1.5" />
    <text x="600" y="71" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" text-anchor="middle">✦ CURATED DL ECOSYSTEM ✦</text>

    <!-- Main Title -->
    <text x="600" y="150" fill="url(#primaryGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" text-anchor="middle" filter="url(#glow)">Awesome Deep Learning Frameworks</text>
    <text x="600" y="150" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" text-anchor="middle">Awesome Deep Learning Frameworks</text>

    <!-- Subtitle -->
    <text x="600" y="200" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" text-anchor="middle">Production Infrastructure • Hardware Acceleration • Distributed Training &amp; Serving</text>

    <!-- Feature Tags -->
    <text x="600" y="246" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" text-anchor="middle">PyTorch • TensorFlow • JAX • vLLM • llama.cpp • DGX Cloud • TPUs • CoreWeave</text>
  </g>
</svg>
